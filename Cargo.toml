[workspace]
resolver = "2"
members = [
    "crates/am-policy",
    "crates/am-proto",
    "crates/am-compute",
    "crates/am-db",
    "crates/am-core",
    "crates/am-agents",
    "crates/am-vcs",
    "crates/am-mcp",
    "crates/am-daemon",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["AgentManager"]

[workspace.dependencies]
# Internal crates
am-proto = { path = "crates/am-proto" }
am-compute = { path = "crates/am-compute" }
am-policy = { path = "crates/am-policy" }
am-db = { path = "crates/am-db" }
am-core = { path = "crates/am-core" }
am-agents = { path = "crates/am-agents" }
am-vcs = { path = "crates/am-vcs" }
am-mcp = { path = "crates/am-mcp" }
am-daemon = { path = "crates/am-daemon" }

# Async + runtime
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
futures = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"

# Errors + logging
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio-util = "0.7"
axum = "0.8"

# Data
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio",
    "sqlite",
    "chrono",
    "macros",
    "migrate",
] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
keyring = { version = "3", features = ["apple-native", "windows-native", "linux-native"] }
sysinfo = "0.33"

[profile.dev]
opt-level = 0
debug = 1
